<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - AirVision</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">AirVision</div>
  <nav>
    <a href="index.html">Головна</a>
    <a href="dashboard.html">Показники</a>

    <button onclick="toggleTheme()" class="btn">Змінити тему</button>
  </nav>
</header>
<main class="content">
  <section class="dashboard">
    <h1>Air Quality Dashboard</h1>

    <div class="grid">
      <div class="card">AQI: <span id="aqi">72</span></div>
      <div class="card">PM2.5: 18</div>
      <div class="card">Температура: 23°C</div>
      <div class="card">Вологість: 55%</div>
    </div>

    <button onclick="randomizeAQI()" class="btn">
      Оновити дані
    </button>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
